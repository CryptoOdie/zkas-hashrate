name: share-og

on:
  schedule:
    - cron: "40 12 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: share-og
  cancel-in-progress: false

jobs:
  og:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: node og-share/build.js
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Deploy zkas-share
        working-directory: share-site
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KASPAS_DATA_INFRASTRUCTURE }}' > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx -y firebase-tools@13 deploy --only hosting --project kaspas-data-infrastructure --non-interactive
      - name: Commit new image
        run: |
          git config user.name "zkas-hashrate-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add share-site/public
          git diff --cached --quiet && exit 0
          git commit -m "share og: $(date -u +%Y-%m-%d)"
          git pull --rebase --quiet
          git push
